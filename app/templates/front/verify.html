<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>访问验证 - {{ site_name }}</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1c2333 0%, #2f3f6b 60%, #2f6fed 140%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .verify-box {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 14px;
      padding: 30px 26px;
      box-shadow: 0 20px 50px rgba(10, 20, 40, .3);
    }
    .verify-logo {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2f6fed, #6f9bff);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin: 0 auto 14px;
    }
    .verify-title { text-align: center; font-size: 19px; font-weight: 600; margin: 0 0 4px; color: #1f2633; }
    .verify-sub { text-align: center; color: #6b7280; font-size: 13px; margin: 0 0 22px; }
    .verify-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #e6e9f0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color .15s;
    }
    .verify-input:focus { border-color: #2f6fed; }
    .verify-btn {
      width: 100%;
      height: 44px;
      margin-top: 14px;
      border: none;
      border-radius: 8px;
      background: #2f6fed;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background .15s;
    }
    .verify-btn:hover { background: #1f57c9; }
    .verify-err {
      color: #e5484d;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }
    .verify-tip {
      margin-top: 16px;
      text-align: center;
      color: #9aa3b5;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="verify-box">
    <div class="verify-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <h1 class="verify-title">访问验证</h1>
    <p class="verify-sub">请输入访问验证码以继续浏览</p>
    <form method="post" action="{{ url_for('front.access_verify') }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <input class="verify-input" type="password" name="code" placeholder="请输入访问验证码" autofocus autocomplete="off" required>
      <button class="verify-btn" type="submit">验 证</button>
      <div class="verify-err">{{ error or '' }}</div>
    </form>
    <div class="verify-tip">验证有效期 15 分钟，过期后需重新验证</div>
  </div>
</body>
</html>
