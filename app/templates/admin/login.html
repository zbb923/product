<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>后台登录 - {{ site_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='plugins/layui/css/layui.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin.css') }}">
</head>
<body>

<div class="login-page">
  <div class="login-box">
    <div class="login-logo"><i class="layui-icon layui-icon-app"></i></div>
    <h1 class="login-title">{{ site_name }}</h1>
    <p class="login-sub">后台管理系统</p>

    <form class="layui-form" id="loginForm" onsubmit="return false;">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="layui-form-item">
        <input type="text" name="username" placeholder="请输入登录账号" autocomplete="username"
               class="layui-input" data-submit-on-enter="#loginBtn" required>
      </div>
      <div class="layui-form-item">
        <input type="password" name="password" placeholder="请输入登录密码" autocomplete="current-password"
               class="layui-input" data-submit-on-enter="#loginBtn" required>
      </div>
      <div class="layui-form-item">
        <button type="button" class="layui-btn layui-btn-normal login-btn" id="loginBtn">登 录</button>
      </div>
    </form>

    <div class="login-accounts">
      默认超管：admin / admin123<br>
      运营演示：yunying / yunying123
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='plugins/layui/layui.js') }}"></script>
<script src="{{ url_for('static', filename='admin/admin.js') }}"></script>
<script>
  layui.use(['layer'], function () {
    var btn = document.getElementById('loginBtn');
    var form = document.getElementById('loginForm');

    function doLogin() {
      var username = (form.username.value || '').trim();
      var password = form.password.value || '';
      if (!username) { window.errMsg('请输入登录账号'); return; }
      if (!password) { window.errMsg('请输入登录密码'); return; }

      btn.disabled = true;
      btn.innerText = '登录中...';
      window.post('{{ url_for("auth.login") }}', {
        username: username,
        password: password
      }).then(function (res) {
        btn.disabled = false;
        btn.innerText = '登 录';
        if (res.code === 0) {
          window.layer.msg('登录成功', { icon: 1, time: 600 }, function () {
            window.location.href = (res.data && res.data.redirect) || '/admin/';
          });
        } else {
          window.errMsg(res.msg || '登录失败');
        }
      });
    }

    btn.addEventListener('click', doLogin);
    form.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
    form.username.focus();
  });
</script>
</body>
</html>
