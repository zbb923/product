{% extends 'admin/layout.html' %}
{% block title %}分类管理{% endblock %}

{% block content %}
<div class="page-head">
  <h2 class="page-title">分类管理</h2>
  <div class="spacer"></div>
  {% if has_perm('category:add') %}
  <button type="button" class="layui-btn layui-btn-normal" id="addBtn">
    <i class="layui-icon layui-icon-add-1"></i> 新增分类
  </button>
  {% endif %}
</div>

<div class="card">
  <div class="search-bar">
    <input type="text" id="keyword" class="layui-input" placeholder="分类名称" autocomplete="off">
    <button type="button" class="layui-btn layui-btn-normal" id="searchBtn">
      <i class="layui-icon layui-icon-search"></i> 查询
    </button>
    <button type="button" class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
  </div>
  <div class="table-wrap">
    <table id="categoryTable" lay-filter="categoryTable"></table>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
  window.PERM = {
    add: {{ 'true' if has_perm('category:add') else 'false' }},
    edit: {{ 'true' if has_perm('category:edit') else 'false' }},
    del: {{ 'true' if has_perm('category:delete') else 'false' }}
  };

  layui.use(['table'], function () {
    var table = layui.table;
    var $ = layui.$;
    var PERM = window.PERM;

    var tableIns = table.render({
      elem: '#categoryTable',
      id: 'categoryTable',
      url: '{{ url_for("product.category_data") }}',
      method: 'get',
      page: true,
      limit: 15,
      limits: [15, 30, 50],
      text: { none: '暂无分类数据' },
      cols: [[
        { field: 'id', title: 'ID', width: 66, align: 'center' },
        { field: 'name', title: '分类名称', minWidth: 160 },
        { field: 'product_count', title: '产品数量', width: 96, align: 'center' },
        { field: 'sort', title: '排序', width: 80, align: 'center' },
        {
          field: 'status', title: '状态', width: 92, align: 'center',
          templet: function (d) {
            return d.status == 1
              ? '<span class="tag tag-on">启用</span>'
              : '<span class="tag tag-off">禁用</span>';
          }
        },
        { field: 'created_at', title: '创建时间', width: 150 },
        {
          title: '操作', width: 140, align: 'center',
          templet: function (d) {
            var html = [];
            if (PERM.edit) html.push('<a class="layui-btn layui-btn-xs js-edit" data-id="' + d.id + '">编辑</a>');
            if (PERM.del) html.push('<a class="layui-btn layui-btn-xs layui-btn-danger js-del" data-id="' + d.id + '" data-name="' + window.esc(d.name) + '">删除</a>');
            return html.length ? html.join(' ') : '<span style="color:#8a93a5;">无权限</span>';
          }
        }
      ]]
    });

    function formHtml(d) {
      d = d || {};
      return '<div class="mf">'
        + '<div class="mf-item"><label class="mf-label req">分类名称</label>'
        + '<input type="text" class="layui-input" id="mf_name" maxlength="100" placeholder="请输入分类名称" value="' + window.esc(d.name || '') + '"></div>'
        + '<div class="mf-item"><label class="mf-label">排序</label>'
        + '<input type="number" class="layui-input" id="mf_sort" value="' + (d.sort === undefined ? 0 : d.sort) + '">'
        + '<div class="mf-tip">数字越小越靠前</div></div>'
        + '<div class="mf-item"><label class="mf-label">状态</label>'
        + '<select class="native-select" id="mf_status">'
        + '<option value="1"' + (d.status == 0 ? '' : ' selected') + '>启用</option>'
        + '<option value="0"' + (d.status == 0 ? ' selected' : '') + '>禁用</option>'
        + '</select></div></div>';
    }

    function openForm(row) {
      var isEdit = !!row;
      window.layer.open({
        type: 1,
        title: isEdit ? '编辑分类' : '新增分类',
        area: ['480px', 'auto'],
        content: formHtml(row),
        btn: ['保存', '取消'],
        yes: function (index, layero) {
          var name = $.trim(layero.find('#mf_name').val());
          if (!name) { window.errMsg('请填写分类名称'); return; }
          var url = isEdit ? '/admin/category/edit/' + row.id : '{{ url_for("product.category_add") }}';
          window.post(url, {
            name: name,
            sort: layero.find('#mf_sort').val() || 0,
            status: layero.find('#mf_status').val()
          }).then(function (res) {
            window.handleRes(res, function () {
              window.layer.close(index);
              tableIns.reload();
            });
          });
        }
      });
    }

    if (PERM.add) $('#addBtn').on('click', function () { openForm(null); });

    $(document).on('click', '.js-edit', function () {
      var id = $(this).data('id');
      var cache = table.cache['categoryTable'] || [];
      var row = null;
      for (var i = 0; i < cache.length; i++) {
        if (cache[i].id == id) { row = cache[i]; break; }
      }
      openForm(row || { id: id });
    });

    $(document).on('click', '.js-del', function () {
      var id = $(this).data('id');
      var name = $(this).data('name');
      window.layer.confirm('确定要删除分类「' + name + '」吗？', {
        icon: 3, title: '删除确认', btn: ['确定删除', '取消']
      }, function (index) {
        window.layer.close(index);
        window.post('/admin/category/delete/' + id, {}).then(function (res) {
          window.handleRes(res, function () { tableIns.reload(); });
        });
      });
    });

    function reload() {
      table.reload('categoryTable', {
        where: { keyword: $('#keyword').val().trim() },
        page: { curr: 1 }
      });
    }
    $('#searchBtn').on('click', reload);
    $('#keyword').on('keydown', function (e) { if (e.key === 'Enter') reload(); });
    $('#resetBtn').on('click', function () { $('#keyword').val(''); reload(); });
  });
</script>
{% endblock %}
