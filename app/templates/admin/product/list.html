{% extends 'admin/layout.html' %}
{% block title %}产品管理{% endblock %}

{% block content %}
<div class="page-head">
  <h2 class="page-title">产品管理</h2>
  <div class="spacer"></div>
  {% if has_perm('product:add') %}
  <a class="layui-btn layui-btn-normal" href="{{ url_for('product.product_add') }}">
    <i class="layui-icon layui-icon-add-1"></i> 新增产品
  </a>
  {% endif %}
</div>

<div class="card">
  <div class="search-bar">
    <input type="text" id="keyword" class="layui-input" placeholder="产品名称 / 规格" autocomplete="off">
    <select id="categoryId" class="native-select">
      <option value="">全部分类</option>
      {% for c in categories %}
      <option value="{{ c.id }}">{{ c.name }}</option>
      {% endfor %}
    </select>
    <select id="status" class="native-select">
      <option value="">全部状态</option>
      <option value="1">已上架</option>
      <option value="0">已下架</option>
    </select>
    <button type="button" class="layui-btn layui-btn-normal" id="searchBtn">
      <i class="layui-icon layui-icon-search"></i> 查询
    </button>
    <button type="button" class="layui-btn layui-btn-primary" id="resetBtn">重置</button>
  </div>
  <div class="table-wrap">
    <table id="productTable" lay-filter="productTable"></table>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
  window.PERM = {
    add: {{ 'true' if has_perm('product:add') else 'false' }},
    edit: {{ 'true' if has_perm('product:edit') else 'false' }},
    del: {{ 'true' if has_perm('product:delete') else 'false' }}
  };

  layui.use(['table'], function () {
    var table = layui.table;
    var $ = layui.$;
    var PERM = window.PERM;

    var tableIns = table.render({
      elem: '#productTable',
      id: 'productTable',
      url: '{{ url_for("product.product_data") }}',
      method: 'get',
      page: true,
      limit: 15,
      limits: [15, 30, 50],
      text: { none: '暂无产品数据' },
      cols: [[
        { field: 'id', title: 'ID', width: 66, align: 'center' },
        {
          field: 'image', title: '图片', width: 76, align: 'center',
          templet: function (d) {
            return d.image
              ? '<img class="prod-thumb" src="' + window.esc(d.image) + '" alt="">'
              : '<span class="prod-thumb-empty">无图</span>';
          }
        },
        { field: 'name', title: '产品名称', minWidth: 180 },
        { field: 'category_name', title: '分类', width: 110 },
        { field: 'spec', title: '规格/型号', width: 140 },
        {
          field: 'price', title: '单价(元)', width: 120, align: 'right',
          templet: function (d) {
            return '<span style="color:#e5484d;font-weight:600;">￥' + window.esc(d.price)
              + '</span><span style="color:#8a93a5;"> /' + window.esc(d.unit) + '</span>';
          }
        },
        { field: 'sort', title: '排序', width: 88, align: 'center', edit: 'text' },
        {
          field: 'status', title: '状态', width: 92, align: 'center',
          templet: function (d) {
            return d.status == 1
              ? '<span class="tag tag-on">已上架</span>'
              : '<span class="tag tag-off">已下架</span>';
          }
        },
        { field: 'views', title: '浏览', width: 76, align: 'center' },
        {
          title: '操作', width: 188, align: 'center',
          templet: function (d) {
            var html = [];
            if (PERM.edit) {
              html.push('<a class="layui-btn layui-btn-xs js-edit" data-id="' + d.id + '">编辑</a>');
              html.push('<a class="layui-btn layui-btn-xs ' + (d.status == 1 ? 'layui-btn-primary' : 'layui-btn-normal')
                + ' js-toggle" data-id="' + d.id + '" data-status="' + d.status + '">'
                + (d.status == 1 ? '下架' : '上架') + '</a>');
            }
            if (PERM.del) {
              html.push('<a class="layui-btn layui-btn-xs layui-btn-danger js-del" data-id="' + d.id
                + '" data-name="' + window.esc(d.name) + '">删除</a>');
            }
            return html.length ? html.join(' ') : '<span style="color:#8a93a5;">无权限</span>';
          }
        }
      ]]
    });

    function reload(resetPage) {
      table.reload('productTable', {
        where: {
          keyword: document.getElementById('keyword').value.trim(),
          category_id: document.getElementById('categoryId').value,
          status: document.getElementById('status').value
        },
        page: resetPage ? { curr: 1 } : {}
      });
    }

    document.getElementById('searchBtn').addEventListener('click', function () { reload(true); });
    document.getElementById('keyword').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') reload(true);
    });
    document.getElementById('resetBtn').addEventListener('click', function () {
      document.getElementById('keyword').value = '';
      document.getElementById('categoryId').value = '';
      document.getElementById('status').value = '';
      reload(true);
    });
    document.getElementById('categoryId').addEventListener('change', function () { reload(true); });
    document.getElementById('status').addEventListener('change', function () { reload(true); });

    // 行内排序
    table.on('edit(productTable)', function (obj) {
      var sort = parseInt(obj.value, 10);
      if (isNaN(sort)) {
        window.errMsg('排序必须是数字');
        obj.update({ sort: obj.oldValue });
        return;
      }
      window.post('{{ url_for("product.product_sort") }}', { id: obj.data.id, sort: sort })
        .then(function (res) {
          if (res.code === 0) {
            window.tip('排序已更新', 1);
          } else {
            window.errMsg(res.msg);
            obj.update({ sort: obj.oldValue });
          }
        });
    });

    // 编辑
    $(document).on('click', '.js-edit', function () {
      window.location.href = '/admin/product/edit/' + $(this).data('id');
    });

    // 上下架
    $(document).on('click', '.js-toggle', function () {
      var id = $(this).data('id');
      var isOn = $(this).data('status') == 1;
      window.confirmDo('确定要' + (isOn ? '下架' : '上架') + '该产品吗？', function () {
        window.post('/admin/product/toggle/' + id, {}).then(function (res) {
          window.handleRes(res, function () { tableIns.reload(); });
        });
      });
    });

    // 删除
    $(document).on('click', '.js-del', function () {
      var id = $(this).data('id');
      var name = $(this).data('name');
      window.layer.confirm('确定要删除产品「' + name + '」吗？删除后不可恢复。', {
        icon: 3, title: '删除确认', btn: ['确定删除', '取消']
      }, function (index) {
        window.layer.close(index);
        window.post('/admin/product/delete/' + id, {}).then(function (res) {
          window.handleRes(res, function () { tableIns.reload(); });
        });
      });
    });
  });
</script>
{% endblock %}
